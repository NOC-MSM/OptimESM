# ================================================================================ #
# config_EC-Earth3-ESM-1_esm-hist.toml
#
# Description: EC-Earth3-ESM-1 configuration for NEMO pipeline - Davis Strait extraction.
# ================================================================================ #

[slurm]
# Define directories for SLURM job scripts and logs:
job_dir = "/g100_work/optim_IAC/research/noc/otooth/OptimESM/WP5/data/SMHI/jobs"
log_dir = "/g100_work/optim_IAC/research/noc/otooth/OptimESM/WP5/data/SMHI/logs"
log_prefix = "EC-Earth3-ESM-1_osnap"
# SLURM batch job submission parameters:
sbatch_job_name = "nemo_pipeline_ec-earth"
sbatch_time = "00:10:00"
sbatch_partition = ""
sbatch_ntasks = 1
sbatch_mem = "4G"
# Define the initial, final and step input patterns for batch job submission:
ip_start = 1850
ip_end = 2014
ip_step = 1
# Define maximum number of concurrent SLURM jobs:
max_concurrent_jobs = 1
# Define Python virtual environment activation command:
venv_cmd = ""

[inputs]
# Define NEMO ocean model filepaths used to construct NEMODataTree object:
nemo_dir = "/g100_work/optim_IAC/research/noc/otooth/OptimESM/data/EC-Earth3-ESM-1/esm-hist/r5i1p1f1"
domain_filepath = "/g100_work/optim_IAC/research/noc/otooth/OptimESM/data/EC-Earth3-ESM-1/Ofx/eORCA1_domain_cfg_EC-Earth.nc"
# Create NEMO model grid datasets from CMORISED variables:
cmorised = true
# Domain Properties:
iperio = true
nftype = "F"
read_mask = true
# -- NEMO gridT (scalar) variables -- #
gridT_filepath = [ "${nemo_dir}/OPmonLev/thetao/gn/v*/thetao_OPmonLev_EC-Earth3-ESM-1_esm-hist_r5i1p1f1_gn_*.nc", "${nemo_dir}/OPmonLev/so/gn/v*/so_OPmonLev_EC-Earth3-ESM-1_esm-hist_r5i1p1f1_gn_*.nc", "${nemo_dir}/OPmonLev/thkcello/gn/v*/thkcello_OPmonLev_EC-Earth3-ESM-1_esm-hist_r5i1p1f1_gn_*.nc" ]
gridT_vars = [ [ "thetao" ], [ "so" ], ["thkcello"] ]
# -- NEMO U-grid (zonal vector) variables -- #
gridU_filepath = [ "${nemo_dir}/OPmon/tauuo/gn/v*/tauuo_OPmon_EC-Earth3-ESM-1_esm-hist_r5i1p1f1_gn_*.nc" ]
gridU_vars = [ [ "tauuo" ] ]
# NEMO V-grid (meridional vector) variables:
gridV_filepath = [ "${nemo_dir}/OPmonLev/vmo/gn/v*/vmo_OPmonLev_EC-Earth3-ESM-1_esm-hist_r5i1p1f1_gn_*.nc" ]
gridV_vars = [ [ "vmo" ] ]

# ================================================================================ #

[diagnostics]
# Define diagnostics to be computed using NEMODataTree:
diagnostic = { module = "nemo_pipeline.diagnostics.core", function = "extract_zonal_section" }
kwargs = { lat = 67.3, lon_min = -65.3, lon_max = -50.4, tau_name = "tauuo", scalar_names = [ "thetao", "so", "e3t" ] }

# ================================================================================ #

[outputs]
# Define NEMO ocean model pipeline output file:
output_dir = "/g100_work/optim_IAC/research/noc/otooth/OptimESM/WP5/data/SMHI/davis"
output_name = "EC-Earth3-ESM-1_esm-hist_r5i1p1f1_davis"
date_format = "M"
format = "netcdf"
# Define output dataset chunking:
chunks = { time_counter = 12 }